global:
    scrape_interval: 15s
    evaluation_interval: 15s
  

scrape_configs:
    - job_name: 'fastapi'
      metrics_path: '/TrhBVer'
      static_configs:
        - targets: ['fastapi:8000']
      
    
    - job_name: 'prometheus'
      static_configs:
        - targets: ['localhost:9090']

    - job_name: 'postgres'
      static_configs:
        - targets: ['postgres_exporter:9187']
      

    - job_name: 'qdrant'
      static_configs:
        - targets: ['qdrant:6333']
      metrics_path: '/metrics'
    
    
